<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" font-family="Arial, Helvetica, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">One hex digit = 4 bits</text>

  <!-- place values -->
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="127" y="60">8</text><text x="165" y="60">4</text><text x="203" y="60">2</text><text x="241" y="60">1</text>
    <text x="317" y="60">8</text><text x="355" y="60">4</text><text x="393" y="60">2</text><text x="431" y="60">1</text>
  </g>

  <!-- bit boxes -->
  <g fill="#f3f4f6" stroke="#374151" stroke-width="1.5">
    <rect x="110" y="68" width="34" height="34"/><rect x="148" y="68" width="34" height="34"/>
    <rect x="186" y="68" width="34" height="34"/><rect x="224" y="68" width="34" height="34"/>
    <rect x="300" y="68" width="34" height="34"/><rect x="338" y="68" width="34" height="34"/>
    <rect x="376" y="68" width="34" height="34"/><rect x="414" y="68" width="34" height="34"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="127" y="92">1</text><text x="165" y="92">0</text><text x="203" y="92">1</text><text x="241" y="92">1</text>
    <text x="317" y="92">0</text><text x="355" y="92">1</text><text x="393" y="92">1</text><text x="431" y="92">0</text>
  </g>
  <text x="40" y="92" font-size="13" fill="#374151">binary</text>

  <!-- brackets -->
  <path d="M110 110 L110 118 L258 118 L258 110" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M300 110 L300 118 L448 118 L448 110" fill="none" stroke="#2563eb" stroke-width="2"/>
  <line x1="184" y1="118" x2="184" y2="140" stroke="#2563eb" stroke-width="2"/>
  <line x1="374" y1="118" x2="374" y2="140" stroke="#2563eb" stroke-width="2"/>

  <!-- hex digits -->
  <rect x="154" y="142" width="60" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="344" y="142" width="60" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="184" y="169" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a8a">B</text>
  <text x="374" y="169" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a8a">6</text>
  <text x="40" y="167" font-size="13" fill="#374151">hex</text>
  <text x="184" y="200" text-anchor="middle" font-size="12" fill="#374151">8 + 2 + 1 = 11 = B</text>
  <text x="374" y="200" text-anchor="middle" font-size="12" fill="#374151">4 + 2 = 6</text>

  <text x="280" y="240" text-anchor="middle" font-size="15" fill="#111827">1011 0110 (binary) = <tspan font-weight="bold">0xB6</tspan> = 11 × 16 + 6 = <tspan font-weight="bold">182</tspan></text>
</svg>

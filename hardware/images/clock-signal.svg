<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker>
  </defs>
  <rect width="600" height="230" fill="#ffffff"/>
  <text x="300" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">The clock: one tick per step</text>

  <!-- instruction labels, one per tick -->
  <g font-size="11" fill="#1e3a8a" text-anchor="middle">
    <rect x="44" y="40" width="72" height="20" rx="4" fill="#dbeafe"/><text x="80" y="54">instr 1</text>
    <rect x="124" y="40" width="72" height="20" rx="4" fill="#dbeafe"/><text x="160" y="54">instr 2</text>
    <rect x="204" y="40" width="72" height="20" rx="4" fill="#dbeafe"/><text x="240" y="54">instr 3</text>
    <rect x="284" y="40" width="72" height="20" rx="4" fill="#dbeafe"/><text x="320" y="54">instr 4</text>
    <rect x="364" y="40" width="72" height="20" rx="4" fill="#dbeafe"/><text x="400" y="54">instr 5</text>
    <rect x="444" y="40" width="72" height="20" rx="4" fill="#dbeafe"/><text x="480" y="54">instr 6</text>
  </g>

  <!-- square wave: 6 periods of 80 px -->
  <path d="M20 130 L40 130 L40 75 L80 75 L80 130 L120 130 L120 75 L160 75 L160 130 L200 130 L200 75 L240 75 L240 130 L280 130 L280 75 L320 75 L320 130 L360 130 L360 75 L400 75 L400 130 L440 130 L440 75 L480 75 L480 130 L520 130 L540 130" fill="none" stroke="#111827" stroke-width="2.5"/>
  <text x="560" y="80" font-size="11" fill="#6b7280">HIGH</text>
  <text x="560" y="134" font-size="11" fill="#6b7280">LOW</text>

  <!-- one period dimension -->
  <line x1="40" y1="140" x2="40" y2="160" stroke="#9ca3af" stroke-dasharray="3 3"/>
  <line x1="120" y1="140" x2="120" y2="160" stroke="#9ca3af" stroke-dasharray="3 3"/>
  <line x1="42" y1="152" x2="118" y2="152" stroke="#374151" stroke-width="1.5" marker-start="url(#ak)" marker-end="url(#ak)"/>
  <text x="80" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">1 tick = 62.5 ns</text>

  <text x="300" y="206" text-anchor="middle" font-size="13" fill="#111827">Uno clock: 16 MHz = 16 000 000 ticks per second → 1 / 16 000 000 s = 62.5 ns per tick</text>
  <text x="300" y="224" text-anchor="middle" font-size="12" fill="#6b7280">Most ATmega328P instructions finish in one tick; some take two or more.</text>
</svg>

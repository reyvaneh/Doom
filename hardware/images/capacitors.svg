<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="270" fill="#ffffff"/>
  <line x1="350" y1="20" x2="350" y2="255" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ===== Two types ===== -->
  <text x="175" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Two types</text>

  <!-- ceramic -->
  <line x1="90" y1="140" x2="90" y2="200" stroke="#6b7280" stroke-width="3"/>
  <line x1="110" y1="140" x2="110" y2="200" stroke="#6b7280" stroke-width="3"/>
  <ellipse cx="100" cy="115" rx="38" ry="32" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="100" y="121" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">104</text>
  <text x="100" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Ceramic: no polarity</text>
  <text x="100" y="242" text-anchor="middle" font-size="11" fill="#374151">104 = 10 + 0000 pF = 100 nF</text>

  <!-- electrolytic -->
  <line x1="245" y1="160" x2="245" y2="212" stroke="#6b7280" stroke-width="3"/>
  <line x1="275" y1="160" x2="275" y2="196" stroke="#6b7280" stroke-width="3"/>
  <rect x="230" y="70" width="60" height="92" rx="10" fill="#1e3a8a"/>
  <rect x="270" y="70" width="16" height="92" fill="#cbd5e1"/>
  <text x="278" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">−</text>
  <text x="278" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">−</text>
  <text x="248" y="122" text-anchor="middle" font-size="11" fill="#ffffff">470µF</text>
  <text x="235" y="208" text-anchor="end" font-size="13" font-weight="bold" fill="#111827">+</text>
  <text x="260" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Electrolytic: polarised</text>
  <text x="260" y="242" text-anchor="middle" font-size="11" fill="#374151">stripe = −, longer leg = +</text>

  <!-- ===== Two jobs ===== -->
  <text x="535" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Two jobs</text>
  <line x1="370" y1="60" x2="705" y2="60" stroke="#dc2626" stroke-width="3"/>
  <text x="372" y="54" font-size="12" font-weight="bold" fill="#dc2626">5 V</text>
  <line x1="370" y1="200" x2="705" y2="200" stroke="#111827" stroke-width="3"/>
  <text x="372" y="216" font-size="12" font-weight="bold" fill="#111827">GND</text>

  <!-- chip + decoupling -->
  <line x1="440" y1="60" x2="440" y2="105" stroke="#374151" stroke-width="2"/>
  <line x1="440" y1="155" x2="440" y2="200" stroke="#374151" stroke-width="2"/>
  <rect x="405" y="105" width="70" height="50" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">chip</text>
  <line x1="500" y1="60" x2="500" y2="124" stroke="#374151" stroke-width="2"/>
  <line x1="488" y1="124" x2="512" y2="124" stroke="#2563eb" stroke-width="3"/>
  <line x1="488" y1="134" x2="512" y2="134" stroke="#2563eb" stroke-width="3"/>
  <line x1="500" y1="134" x2="500" y2="200" stroke="#374151" stroke-width="2"/>
  <text x="470" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">0.1 µF decoupling</text>
  <text x="470" y="252" text-anchor="middle" font-size="11" fill="#374151">right next to the chip's power pin</text>

  <!-- servo + bulk -->
  <line x1="610" y1="60" x2="610" y2="105" stroke="#374151" stroke-width="2"/>
  <line x1="610" y1="155" x2="610" y2="200" stroke="#374151" stroke-width="2"/>
  <rect x="575" y="105" width="70" height="50" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="610" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">servo</text>
  <line x1="675" y1="60" x2="675" y2="122" stroke="#374151" stroke-width="2"/>
  <line x1="660" y1="122" x2="690" y2="122" stroke="#1e3a8a" stroke-width="3"/>
  <path d="M660 136 Q675 128 690 136" fill="none" stroke="#1e3a8a" stroke-width="3"/>
  <line x1="675" y1="133" x2="675" y2="200" stroke="#374151" stroke-width="2"/>
  <text x="693" y="118" font-size="12" font-weight="bold" fill="#111827">+</text>
  <text x="635" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">≥ 470 µF bulk</text>
  <text x="635" y="252" text-anchor="middle" font-size="11" fill="#374151">stops servo start-up resetting the Uno</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker>
  </defs>
  <rect width="720" height="300" fill="#ffffff"/>
  <line x1="360" y1="20" x2="360" y2="280" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- von Neumann -->
  <text x="180" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">von Neumann (paper CPU)</text>
  <rect x="120" y="60" width="120" height="50" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="180" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">CPU</text>
  <line x1="180" y1="114" x2="180" y2="176" stroke="#7c3aed" stroke-width="4" marker-start="url(#ak)" marker-end="url(#ak)"/>
  <text x="192" y="150" font-size="12" fill="#6d28d9">one shared bus</text>
  <rect x="90" y="180" width="180" height="60" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="180" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Memory</text>
  <text x="180" y="226" text-anchor="middle" font-size="12" fill="#374151">program + data together</text>
  <text x="180" y="272" text-anchor="middle" font-size="13" fill="#111827">Fetch and data access take turns</text>

  <!-- Harvard -->
  <text x="540" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Harvard (ATmega328P)</text>
  <rect x="480" y="60" width="120" height="50" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="540" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">CPU</text>
  <line x1="510" y1="114" x2="468" y2="176" stroke="#2563eb" stroke-width="4" marker-start="url(#ak)" marker-end="url(#ak)"/>
  <line x1="570" y1="114" x2="612" y2="176" stroke="#16a34a" stroke-width="4" marker-start="url(#ak)" marker-end="url(#ak)"/>
  <text x="438" y="145" text-anchor="middle" font-size="12" fill="#1d4ed8">program bus</text>
  <text x="646" y="145" text-anchor="middle" font-size="12" fill="#15803d">data bus</text>
  <rect x="400" y="180" width="130" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="465" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Flash</text>
  <text x="465" y="226" text-anchor="middle" font-size="12" fill="#374151">program (32 KB)</text>
  <rect x="550" y="180" width="130" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="615" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">SRAM</text>
  <text x="615" y="226" text-anchor="middle" font-size="12" fill="#374151">variables (2 KB)</text>
  <text x="540" y="272" text-anchor="middle" font-size="13" fill="#111827">Fetches the next instruction while executing</text>
</svg>

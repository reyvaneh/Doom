<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <line x1="253" y1="20" x2="253" y2="310" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="506" y1="20" x2="506" y2="310" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ===== UART ===== -->
  <text x="126" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">UART</text>
  <rect x="20" y="70" width="80" height="120" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="60" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Uno</text>
  <rect x="160" y="70" width="80" height="120" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="200" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Module</text>
  <g font-size="12" fill="#111827">
    <text x="28" y="104">TX (1)</text><text x="28" y="154">RX (0)</text><text x="28" y="179">GND</text>
    <text x="206" y="104">TX</text><text x="206" y="154">RX</text><text x="200" y="179">GND</text>
  </g>
  <line x1="100" y1="100" x2="158" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ak)"/>
  <line x1="160" y1="100" x2="102" y2="150" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ak)"/>
  <line x1="100" y1="175" x2="160" y2="175" stroke="#111827" stroke-width="2"/>
  <text x="130" y="88" text-anchor="middle" font-size="11" fill="#6b7280">crossed</text>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="126" y="232">Exactly 2 devices</text>
    <text x="126" y="250">No clock wire</text>
    <text x="126" y="268">Both agree a baud rate (e.g. 9600)</text>
  </g>

  <!-- ===== I2C ===== -->
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">I²C</text>
  <rect x="268" y="70" width="64" height="100" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="300" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Uno</text>
  <text x="274" y="99" font-size="11" fill="#111827">SDA A4</text>
  <text x="274" y="139" font-size="11" fill="#111827">SCL A5</text>
  <line x1="332" y1="95" x2="492" y2="95" stroke="#2563eb" stroke-width="3"/>
  <line x1="332" y1="135" x2="492" y2="135" stroke="#ea580c" stroke-width="3"/>
  <text x="494" y="99" font-size="10" fill="#1d4ed8" text-anchor="end" dy="-8">SDA</text>
  <text x="494" y="139" font-size="10" fill="#c2410c" text-anchor="end" dy="-8">SCL</text>
  <text x="412" y="68" text-anchor="middle" font-size="11" fill="#6b7280">+ 4.7 kΩ pull-ups to 5 V</text>
  <!-- device drops -->
  <line x1="372" y1="180" x2="372" y2="95" stroke="#2563eb" stroke-width="2"/>
  <line x1="392" y1="180" x2="392" y2="135" stroke="#ea580c" stroke-width="2"/>
  <line x1="442" y1="180" x2="442" y2="95" stroke="#2563eb" stroke-width="2"/>
  <line x1="462" y1="180" x2="462" y2="135" stroke="#ea580c" stroke-width="2"/>
  <g fill="#111827"><circle cx="372" cy="95" r="3.5"/><circle cx="392" cy="135" r="3.5"/><circle cx="442" cy="95" r="3.5"/><circle cx="462" cy="135" r="3.5"/></g>
  <rect x="350" y="180" width="64" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="382" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">BH1750</text>
  <text x="382" y="215" text-anchor="middle" font-size="11" fill="#111827">0x23</text>
  <rect x="420" y="180" width="64" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="452" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">BME280</text>
  <text x="452" y="215" text-anchor="middle" font-size="11" fill="#111827">0x77</text>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="380" y="250">2 shared wires</text>
    <text x="380" y="268">Each device has its own address</text>
  </g>

  <!-- ===== SPI ===== -->
  <text x="632" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">SPI</text>
  <rect x="518" y="70" width="66" height="170" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="551" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Uno</text>
  <g font-size="10" fill="#111827">
    <text x="523" y="89">SCK 13</text>
    <text x="523" y="109">COPI 11</text>
    <text x="523" y="129">CIPO 12</text>
    <text x="523" y="154">CS 10</text>
    <text x="523" y="229">CS 9</text>
  </g>
  <!-- shared lines to device A -->
  <line x1="584" y1="85" x2="660" y2="85" stroke="#374151" stroke-width="2"/>
  <line x1="584" y1="105" x2="660" y2="105" stroke="#374151" stroke-width="2"/>
  <line x1="584" y1="125" x2="660" y2="125" stroke="#374151" stroke-width="2"/>
  <line x1="584" y1="150" x2="660" y2="150" stroke="#dc2626" stroke-width="2.5"/>
  <!-- branches to device B -->
  <polyline points="604,85 604,185 660,185" fill="none" stroke="#374151" stroke-width="2"/>
  <polyline points="616,105 616,198 660,198" fill="none" stroke="#374151" stroke-width="2"/>
  <polyline points="628,125 628,211 660,211" fill="none" stroke="#374151" stroke-width="2"/>
  <g fill="#111827"><circle cx="604" cy="85" r="3"/><circle cx="616" cy="105" r="3"/><circle cx="628" cy="125" r="3"/></g>
  <line x1="584" y1="225" x2="660" y2="225" stroke="#dc2626" stroke-width="2.5"/>
  <rect x="660" y="72" width="84" height="90" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="702" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Device A</text>
  <rect x="660" y="174" width="84" height="62" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="702" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Device B</text>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="632" y="262">3 shared wires</text>
    <text x="632" y="280">+ 1 chip-select (CS) per device</text>
    <text x="632" y="298" fill="#dc2626">CS LOW = selected</text>
  </g>
</svg>

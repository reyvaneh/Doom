<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker>
  </defs>
  <rect width="720" height="370" fill="#ffffff"/>

  <!-- CPU -->
  <rect x="20" y="40" width="260" height="280" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="150" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">CPU</text>
  <g fill="#ffffff" stroke="#374151" stroke-width="1.5">
    <rect x="40" y="90" width="70" height="40" rx="4"/>
    <rect x="40" y="170" width="70" height="40" rx="4"/>
    <rect x="40" y="250" width="70" height="40" rx="4"/>
    <rect x="115" y="250" width="65" height="40" rx="4"/>
    <rect x="190" y="90" width="80" height="40" rx="4" fill="#dbeafe"/>
    <rect x="190" y="170" width="80" height="40" rx="4" fill="#dcfce7"/>
    <rect x="190" y="250" width="80" height="40" rx="4" fill="#ffedd5"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="75" y="115">PC</text>
    <text x="75" y="195">IR</text>
    <text x="75" y="275">ACC</text>
    <text x="147" y="275">ALU</text>
    <text x="230" y="115">MAR</text>
    <text x="230" y="195">MDR</text>
    <text x="230" y="275">CU</text>
  </g>
  <line x1="110" y1="110" x2="188" y2="110" stroke="#374151" stroke-width="1.5" marker-end="url(#ak)"/>
  <line x1="190" y1="190" x2="112" y2="190" stroke="#374151" stroke-width="1.5" marker-end="url(#ak)"/>

  <!-- Memory -->
  <rect x="520" y="40" width="180" height="280" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="610" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Memory</text>
  <g font-size="13" fill="#111827" font-family="Consolas, Menlo, monospace">
    <text x="540" y="80">0  LOAD 4</text>
    <text x="540" y="110">1  ADD 5</text>
    <text x="540" y="140">2  STORE 6</text>
    <text x="540" y="170">3  HALT</text>
    <text x="540" y="200">4  7</text>
    <text x="540" y="230">5  5</text>
    <text x="540" y="260">6  0</text>
  </g>
  <text x="610" y="300" text-anchor="middle" font-size="11" fill="#6b7280">address · contents</text>

  <!-- buses -->
  <line x1="272" y1="110" x2="516" y2="110" stroke="#2563eb" stroke-width="4" marker-end="url(#ab)"/>
  <text x="396" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Address bus (one way)</text>
  <line x1="276" y1="190" x2="516" y2="190" stroke="#16a34a" stroke-width="4" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="396" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Data bus (two way)</text>
  <line x1="276" y1="270" x2="516" y2="270" stroke="#ea580c" stroke-width="4" marker-start="url(#ao)" marker-end="url(#ao)"/>
  <text x="396" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">Control bus</text>
  <text x="396" y="292" text-anchor="middle" font-size="12" fill="#c2410c">read · write · clock · interrupt</text>

  <text x="360" y="350" text-anchor="middle" font-size="13" fill="#111827">Fetch: PC → MAR → address bus → CU sends <tspan font-style="italic">read</tspan> → instruction returns on data bus → MDR → IR</text>
</svg>
